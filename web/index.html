  <style id="splash-screen-style">
    html, body {
      height: 100%;
      margin: 0;
      background-color: #EC5B13;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    #native-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #EC5B13;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    
    .splash-logo {
      width: 180px;
      height: 180px;
      animation: pulse 2s infinite ease-in-out;
      margin-bottom: 32px;
    }

    .splash-text {
      font-size: 42px;
      font-weight: 700;
      color: white;
      letter-spacing: -1.0px;
      margin: 0 0 12px 0;
    }

    .loader-track {
      width: 40px;
      height: 2px;
      background-color: rgba(255, 255, 255, 0.24);
      overflow: hidden;
      position: relative;
    }

    .loader-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background-color: white;
      width: 50%;
      animation: load 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes load {
      0% { left: -50%; }
      100% { left: 100%; }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      // 1. Remove auto-generated splash if it exists
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      
      // 2. Remove our custom instant HTML splash gracefully
      const nativeSplash = document.getElementById('native-splash');
      if (nativeSplash) {
        nativeSplash.style.transition = 'opacity 0.6s ease-out';
        nativeSplash.style.opacity = '0';
        setTimeout(() => nativeSplash.remove(), 600);
      }

      document.body.style.background = "transparent";
      document.body.style.overflow = "auto";
    }
  </script>
</head>
<body>
  <!-- INSTANT HTML SPLASH (Mirrors Flutter UI exactly) -->
  <div id="native-splash">
    <img class="splash-logo" src="assets/assets/images/logo2.png" alt="V">
    <h1 class="splash-text">VailMeds</h1>
    <div class="loader-track">
      <div class="loader-bar"></div>
    </div>
  </div>
  <!-- Native Web Splash physically scrubbed. Hands rendering directly to Flutter Canvaskit payload. -->
  <script>
    // --- FORCED RENDERER (Circuit Breaker) ---
    // Specifically hardcoded to bypass CLI flag dependencies.
    window.flutterConfiguration = {
      renderer: "html",
    };

    // Listener for Dart's custom signal
    window.addEventListener("flutter-engine-started", (event) => {
      console.log("BOOT SUCCESS: Flutter engine confirmed active.");
      removeSplashFromWeb(); // Graceful hand-off to Flutter CanvasKit Splash
    });
  </script>
  <script src="flutter_bootstrap.js" async=""></script>

</body></html>

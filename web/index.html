<!DOCTYPE html><html><head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A high-fidelity pharmacy app for VailMeds.">
  
  <meta name="google-signin-client_id" content="870868324526-vegf2ge7ruvq3vtbdheohqgadisto6u9.apps.googleusercontent.com">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VailMeds">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>VailMeds</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&amp;display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  
  <script src="https://accounts.google.com/gsi/client" async="" defer=""></script>
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  
  
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #42A5F5;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  
  <div id="native-splash">
    <img class="splash-logo" src="assets/assets/images/logo2.png" alt="V">
    <h1 class="splash-text">VailMeds</h1>
    <div class="loader-track">
      <div class="loader-bar"></div>
    </div>
  </div>

  <script>
    function removeSplashFromWeb() {
      const nativeSplash = document.getElementById('native-splash');
      if (nativeSplash) {
        console.log("Removing splash HTML...");
        nativeSplash.style.transition = 'opacity 0.6s ease-out, transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
        nativeSplash.style.opacity = '0';
        nativeSplash.style.transform = 'scale(0.9) translateY(-20px)';
        setTimeout(() => nativeSplash.remove(), 600);
      }
      document.body.style.background = "transparent";
      document.body.style.overflow = "auto";
    }

    window.flutterConfiguration = {
      renderer: "html",
    };

    window.addEventListener("flutter-first-frame", (event) => {
      console.log("BOOT SUCCESS: Flutter first frame rendered.");
      removeSplashFromWeb();
    });
    
    // Fallback: If it drastically fails, we reveal the canvas after 30 seconds
    setTimeout(removeSplashFromWeb, 30000);
  </script>
  <script src="flutter_bootstrap.js" async=""></script>

</body></html>

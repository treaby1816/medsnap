<!DOCTYPE html><html><head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A high-fidelity pharmacy app for VailMeds.">
  
  <meta name="google-signin-client_id" content="870868324526-vegf2ge7ruvq3vtbdheohqgadisto6u9.apps.googleusercontent.com">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VailMeds">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>VailMeds</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&amp;display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  
  <!-- SUPER FAST LOADING: Preload critical assets immediately -->
  <script src="https://accounts.google.com/gsi/client" async="" defer=""></script>
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <style id="splash-screen-style">
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #EC5B13; /* VailMeds Orange */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
    }
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #FFFFFF;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      color: #FFFFFF;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1.2px;
      margin-bottom: 8px;
      animation: pulse 1.5s infinite;
    }
    .tagline {
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      font-weight: 500;
      font-style: italic;
      letter-spacing: 0.5px;
      animation: fadeIn 2s ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(5px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    #native-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      inset: 0;
      background-color: #EC5B13;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
  </style>

  <script>
    function removeSplashFromWeb() {
      const splash = document.getElementById('native-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.remove();
          // Reset body background to match app theme
          document.body.style.backgroundColor = "#FFFFFF"; 
        }, 400);
      }
    }

    window.addEventListener("flutter-first-frame", (event) => {
      console.log("BOOT SUCCESS: Flutter first frame rendered.");
      removeSplashFromWeb();
    });
  </script>
</head>
<body>
  
  <div id="native-splash">
    <div class="loading-spinner"></div>
    <div class="loading-text">VailMeds</div>
    <div class="tagline">Premium Healthcare Delivery</div>
  </div>

  <script src="flutter_bootstrap.js" async=""></script>
</body>
</html>

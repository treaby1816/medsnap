# 1. JVM & TOOLCHAIN CONFIGURATION
# Let the environment decide the JVM path (compatible with Codemagic and Local)

# Modern JVM args optimized for stability and Kotlin 2.0.21
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2,TLSv1.3

# Enable BuildConfig generation (often required by standard plugins)
android.defaults.buildfeatures.buildconfig=true

# 2. ANDROIDX & COMPATIBILITY
android.useAndroidX=true
# Disabled to remove deprecation warning; AGP 9.1 is optimized for native AndroidX
android.enableJetifier=false

# 3. NETWORK STABILITY (The "Nigerian ISP" Fix)
# System properties for the Gradle process itself
systemProp.https.protocols=TLSv1.2
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http2.enabled=false

# 4. BUILD PERFORMANCE
# Disable parallel downloads to keep the connection stable on ISP flickering
org.gradle.parallel=false
# Enable the configuration cache for faster subsequent builds
org.gradle.configuration-cache=false
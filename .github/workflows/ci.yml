name: VailMeds unified CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  flutter-ci:
    name: Flutter Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: flutter format --set-exit-if-changed lib/

      - name: Execute Static Analysis
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        run: flutter test

  react-ci:
    name: React E2E Integration & Playwright Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: react_integration/package.json
        continue-on-error: true # Safe fallback if package.json has not been fully initialized yet

      - name: Install React Dependencies
        run: |
          if [ -f react_integration/package.json ]; then
            cd react_integration
            npm install
          fi

      - name: Install Playwright Browsers
        run: |
          if [ -f react_integration/package.json ]; then
            cd react_integration
            npx playwright install --with-deps
          fi

      - name: Run E2E Tests
        run: |
          if [ -f react_integration/package.json ]; then
            cd react_integration
            npm run test:e2e
          fi

name: vail_meds_v2
description: "A high-fidelity pharmacy app for VailMeds."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core UI & State
  cupertino_icons: ^1.0.8 
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1 
  cached_network_image: ^3.4.1 
  flutter_svg: ^2.0.10+1 
  lottie: ^3.1.2
  
  # Firebase Suite
  firebase_core: ^3.1.1 
  cloud_firestore: ^5.0.2 
  firebase_auth: ^5.1.2 
  firebase_storage: ^12.1.2 
  google_sign_in: ^6.2.1
  
  # Utilities, Storage & Compression
  image_picker: ^1.1.2 
  flutter_image_compress: ^2.3.0 
  path_provider: ^2.1.3 
  path: ^1.9.0 
  http: ^1.2.1 
  permission_handler: ^11.3.1 
  
  # Medical Intelligence & Maps
  google_mlkit_text_recognition: ^0.13.0 
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Payments (Modern Nigeria 2026)
  flutter_paystack_plus: ^2.5.0 # FIXED: Modern replacement for flutter_paystack
  
  # Document & Notifications
  pdf: ^3.10.8
  printing: ^5.11.1
  flutter_local_notifications: ^21.0.0
  
  # UI Widgets & Formatting
  fl_chart: ^0.70.0 
  carousel_slider: ^5.1.2
  url_launcher: ^6.3.2
  intl: ^0.20.2
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0 
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_size: 21
  
flutter_native_splash:
  color: "#EC5B13"
  image: "assets/images/logo.png"
  android_12:
    image: "assets/images/logo.png"
    icon_background_color: "#EC5B13"
    color: "#EC5B13"